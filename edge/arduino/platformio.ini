[platformio]
default_envs = nano_atmega328_old_bootloader

# src/main.cpp and src/dataset_logger.cpp each define setup()/loop(), so every
# environment must select exactly one of them. The dataset logger is bench
# tooling and is deliberately kept out of default_envs: building or uploading it
# has to be an explicit choice.
[common]
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.5
production_src_filter = +<*> -<dataset_logger.cpp>

[env:nano_atmega328_old_bootloader]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_protocol = arduino
board_upload.speed = 57600
monitor_speed = 115200
build_src_filter = ${common.production_src_filter}
lib_deps = ${common.lib_deps}

[env:nano_every]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
build_src_filter = ${common.production_src_filter}
lib_deps = ${common.lib_deps}

# ---------------------------------------------------------------------------
# Bench dataset collection. NOT a deployment target.
#
#   pio run -e dataset_logger -t upload
#   pio device monitor -e dataset_logger
#
# The soil-moisture calibration endpoints below are PROVISIONAL placeholders so
# the build passes; they are not measured. That is tolerable only because the
# capture records soil_moisture_raw_adc alongside the derived percentage, so the
# percentage can be recomputed once the real endpoints are measured (P1-5).
#
# PPFD conversion stays off (§8-1 has not settled on a coefficient). The capture
# records illuminance_lux instead, which lets PPFD be derived afterwards.
# ---------------------------------------------------------------------------
[env:dataset_logger]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_protocol = arduino
board_upload.speed = 57600
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>
lib_deps = ${common.lib_deps}
build_flags =
    -D TB_NODE_ID=\"bench-dataset-01\"
    -D TB_SOIL_TEMPERATURE_ENABLED=1
    -D TB_SOIL_MOISTURE_ENABLED=1
    -D TB_SOIL_MOISTURE_DRY_ADC=620
    -D TB_SOIL_MOISTURE_WET_ADC=280
    -D TB_DATASET_LOGGER=1
    -D TB_DATASET_INTERVAL_MS=60000UL

# ---------------------------------------------------------------------------
# Off-device unit tests. NOT a deployment target.
#
#   pio test -e native
#
# Safety logic that cannot be exercised without a pump is safety logic nobody
# can trust, so the hard interlocks live in Arduino-free translation units and
# this environment compiles them against the host toolchain.
#
# The filter is subtractive on purpose. main.cpp and dataset_logger.cpp each
# define setup()/loop() and SensorAdapter.cpp needs the Arduino core, so none of
# them can link here. Every new source file that includes <Arduino.h> must be
# excluded as well: an accidental omission breaks the build loudly instead of
# quietly dragging the core into a host build.
#
# test_framework is `custom` rather than `unity` so a suite is an ordinary C++
# program with its own main(). That keeps the tests runnable with a bare
# `g++ -std=gnu++17` on a machine without PlatformIO installed, which is how
# they were verified before hardware existed.
# ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = custom
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<dataset_logger.cpp> -<SensorAdapter.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
