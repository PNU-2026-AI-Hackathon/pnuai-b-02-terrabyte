app:
  admin:
    api-key: terrabyte-test-admin-key
  mqtt:
    # Pinned, not inherited. application.yml reads ${MQTT_ENABLED:false}, and
    # docker-compose.yml sets MQTT_ENABLED=true for the backend service - so
    # under `make test` every @SpringBootTest was building an MqttClient,
    # connecting MqttUplinkRouter to the real broker and subscribing to live
    # telemetry, status and ack traffic. Tests must not depend on ambient
    # environment variables, least of all to decide whether they talk to a broker.
    enabled: false
    command-dispatch:
      enabled: false
  scheduling:
    # No background thread may mutate device_command, or publish to a broker,
    # while a test is asserting. Both timed tasks are covered by calling
    # sweepOnce() and publishOnce() directly.
    enabled: false
  security:
    jwt:
      secret: terrabyte-test-secret-must-be-at-least-32-bytes
  datasource:
    postgres:
      url: jdbc:h2:mem:terrabyte;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
    sqlite:
      url: "jdbc:sqlite:file:terrabyte-test?mode=memory&cache=shared"
      driver-class-name: org.sqlite.JDBC
  payment:
    toss:
      enabled: true
      base-url: https://api.tosspayments.com
      client-key: test_ck_test_terrabyte
      secret-key: test_sk_test_terrabyte
      success-url: http://localhost:8081/payment/success
      fail-url: http://localhost:8081/payment/fail
  notification:
    delivery:
      poll-delay-ms: 3600000
      batch-size: 50
      max-attempts: 5
      retry-interval: PT0.01S
      claim-timeout: PT5M
