app:
  admin:
    api-key: terrabyte-test-admin-key
  security:
    jwt:
      secret: terrabyte-test-secret-must-be-at-least-32-bytes
  datasource:
    postgres:
      url: jdbc:h2:mem:terrabyte;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
    sqlite:
      url: "jdbc:sqlite::memory:"
      driver-class-name: org.sqlite.JDBC
  payment:
    toss:
      enabled: true
      base-url: https://api.tosspayments.com
      client-key: test_ck_test_terrabyte
      secret-key: test_sk_test_terrabyte
      success-url: http://localhost:8081/payment/success
      fail-url: http://localhost:8081/payment/fail
